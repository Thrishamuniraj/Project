<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Three team members wearing navy and white embroidered corporate polo shirts, standing together</title>
  <defs>
    <linearGradient id="bgHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16385f"/>
      <stop offset="1" stop-color="#0e2a4a"/>
    </linearGradient>
    <linearGradient id="poloNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4571"/>
      <stop offset="1" stop-color="#0e2a4a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="560" rx="24" fill="url(#bgHero)"/>
  <circle cx="520" cy="90" r="130" fill="#ffffff" opacity="0.04"/>
  <circle cx="70" cy="480" r="160" fill="#ffffff" opacity="0.04"/>

  <!-- back figure: white polo -->
  <g transform="translate(120,150)">
    <ellipse cx="90" cy="330" rx="86" ry="16" fill="#000000" opacity="0.15"/>
    <path d="M20 330 L15 150 Q15 100 90 92 Q165 100 165 150 L160 330 Z" fill="#eef1f5"/>
    <path d="M60 92 Q90 130 120 92 L128 108 L90 140 L52 108 Z" fill="#dfe3ea"/>
    <rect x="78" y="150" width="24" height="20" rx="4" fill="#e2661f"/>
    <circle cx="90" cy="55" r="40" fill="#f0c9a2"/>
    <path d="M52 45 Q90 10 128 45 L124 60 Q90 30 56 60 Z" fill="#3a2b23"/>
  </g>

  <!-- front-left figure: navy polo with embroidered chest logo -->
  <g transform="translate(60,190)">
    <ellipse cx="95" cy="345" rx="92" ry="17" fill="#000000" opacity="0.18"/>
    <path d="M18 345 L12 155 Q12 100 95 90 Q178 100 178 155 L172 345 Z" fill="url(#poloNavy)"/>
    <path d="M62 90 Q95 132 128 90 L138 108 L95 144 L52 108 Z" fill="#0a1f36"/>
    <rect x="80" y="150" width="26" height="22" rx="4" fill="#f2894a" stroke="#ffffff" stroke-width="2"/>
    <path d="M84 156 l4 5 8 -10" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="95" cy="52" r="42" fill="#c98a5e"/>
    <path d="M53 40 Q95 4 137 40 L132 58 Q95 26 58 58 Z" fill="#1c140f"/>
  </g>

  <!-- front-right figure: heather grey polo -->
  <g transform="translate(360,205)">
    <ellipse cx="92" cy="330" rx="90" ry="16" fill="#000000" opacity="0.18"/>
    <path d="M16 330 L10 148 Q10 95 92 86 Q174 95 174 148 L168 330 Z" fill="#c7ccd4"/>
    <path d="M58 86 Q92 126 126 86 L135 103 L92 137 L49 103 Z" fill="#aeb4bf"/>
    <rect x="76" y="144" width="26" height="22" rx="4" fill="#0e2a4a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="92" cy="48" r="41" fill="#8a5a3b"/>
    <path d="M50 34 Q92 2 134 34 L130 66 Q124 44 92 40 Q60 44 54 66 Z" fill="#150f0c"/>
  </g>

  <rect x="40" y="470" width="560" height="2" fill="#ffffff" opacity="0.12"/>
</svg>
