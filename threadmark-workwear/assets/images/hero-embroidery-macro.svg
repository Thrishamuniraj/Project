<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroEmbTitle">
  <title id="heroEmbTitle">Close-up of an embroidery hoop stitching a company emblem onto navy fabric</title>
  <defs>
    <linearGradient id="bgHero2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132f4f"/>
      <stop offset="1" stop-color="#0a1d33"/>
    </linearGradient>
  </defs>
  <rect width="640" height="560" rx="24" fill="url(#bgHero2)"/>
  <circle cx="150" cy="480" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- fabric panel -->
  <rect x="120" y="120" width="400" height="320" rx="12" fill="#16385f"/>
  <rect x="120" y="120" width="400" height="320" rx="12" fill="none" stroke="#274b74" stroke-width="1"/>

  <!-- embroidery hoop -->
  <circle cx="320" cy="280" r="150" fill="none" stroke="#caa46a" stroke-width="14"/>
  <circle cx="320" cy="280" r="150" fill="none" stroke="#a67e42" stroke-width="4"/>
  <circle cx="320" cy="280" r="118" fill="#12233c"/>

  <!-- stitched emblem: letter-mark T with running stitch outline -->
  <g stroke="#f2894a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M250 230 h140"/>
    <path d="M320 230 v120"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none">
    <path d="M250 230 h140"/>
    <path d="M320 230 v120"/>
    <circle cx="320" cy="280" r="90"/>
  </g>

  <!-- needle -->
  <g transform="translate(392,206) rotate(35)">
    <rect x="-4" y="-90" width="8" height="150" rx="4" fill="#e7e9ee"/>
    <circle cx="0" cy="-70" r="5" fill="#0a1d33"/>
  </g>

  <!-- thread spools -->
  <g transform="translate(500,420)">
    <rect x="-22" y="-34" width="44" height="68" rx="6" fill="#e2661f"/>
    <rect x="-22" y="-34" width="44" height="10" rx="4" fill="#c25315"/>
    <rect x="-22" y="24" width="44" height="10" rx="4" fill="#c25315"/>
  </g>
  <g transform="translate(555,400)">
    <rect x="-18" y="-28" width="36" height="56" rx="5" fill="#f7f8fa"/>
    <rect x="-18" y="-28" width="36" height="8" rx="4" fill="#cbd1d9"/>
    <rect x="-18" y="20" width="36" height="8" rx="4" fill="#cbd1d9"/>
  </g>
</svg>
